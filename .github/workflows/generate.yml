name: Generate extension list

on:
  schedule:
    - cron: '11 11 * * *'
  workflow_dispatch: ~
  push:
    branches: ["main"]
    paths:
      - '.github/workflows/generate.yml' # To regenerate extensions.json according to any workflow changes itself
      - 'xExtension-*/metadata.json' # For version/description updates in official extensions
      - 'repositories.json' # For new third-party extensions
      # - 'extensions.json' # Must not be included to avoid causing a commit loop
      - 'generate.php' # To regenerate extensions.json with the latest approach

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FILE: extensions.json

    steps:
      - name: Checkout source code # zizmor: ignore[artipacked] Credentials are needed later
        uses: actions/checkout@v7

      - name: Build JSON file
        run: php ./generate.php

      - name: Setup git
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "<>"

      - name: Get changes
        id: diff
        run: |
          DIFF=$(git diff --numstat -- $FILE | wc -l)
          echo "DIFF=$DIFF" >> $GITHUB_OUTPUT

      - name: Commit changes
        run: |
          git add $FILE
          git commit -m 'Update extension list'
          git push origin $GITHUB_REF
        if: steps.diff.outputs.DIFF != 0
